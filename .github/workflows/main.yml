name: Build iOS App
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
      
    - name: Generate Xcode Project
      run: xcodegen generate
      
    - name: Build and Archive
      run: |
        xcodebuild -project PhoneX.xcodeproj -scheme PhoneX -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        
    - name: Create IPA
      run: |
        mkdir Payload
        cp -r build/Release-iphoneos/PhoneX.app Payload/
        zip -r PhoneX.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: PhoneX-iOS
        path: PhoneX.ipa
